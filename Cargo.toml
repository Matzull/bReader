[workspace]
resolver = "3"
members = [
    "crates/breader-core",
    "crates/breader-imgproc",
    "crates/breader-ecc",
    "crates/breader-linear",
    "crates/breader-qr",
    "crates/breader-datamatrix",
    "crates/breader-pdf417",
    "crates/breader-aztec",
    "crates/breader-content",
    "crates/breader",
    "crates/breader-ffi",
    "tools/bench",
    "tools/video-bench",
    "tools/synth",
]
exclude = ["crates/breader-py", "fuzz"]
default-members = [
    "crates/breader-core",
    "crates/breader-imgproc",
    "crates/breader-ecc",
    "crates/breader-linear",
    "crates/breader-qr",
    "crates/breader-datamatrix",
    "crates/breader-pdf417",
    "crates/breader-aztec",
    "crates/breader-content",
    "crates/breader",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "AGPL-3.0-only"
authors = ["Marcos Alonso"]

[workspace.dependencies]
breader-core = { path = "crates/breader-core" }
breader-imgproc = { path = "crates/breader-imgproc" }
breader-ecc = { path = "crates/breader-ecc" }
breader-linear = { path = "crates/breader-linear" }
breader-qr = { path = "crates/breader-qr" }
breader-datamatrix = { path = "crates/breader-datamatrix" }
breader-pdf417 = { path = "crates/breader-pdf417" }
breader-aztec = { path = "crates/breader-aztec" }
breader-content = { path = "crates/breader-content" }
breader = { path = "crates/breader" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true

[profile.dev]
# Optimised dev profile: the decoder sweeps in cargo test run 10 to 25 times faster than at
# opt-level 0. Debug assertions and overflow checks stay on (docs/TEST-STUDY.md).
opt-level = 1

[profile.dev.package.qrcode]
opt-level = 3

[profile.dev.package.breader-ecc]
opt-level = 3
