[package]
name = "synth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "synth"
path = "src/main.rs"

[dependencies]
datamatrix = { version = "0.3", default-features = false }
barcoders = { version = "2", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.27", default-features = false }
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
rand_chacha = "0.9"
rxing = { version = "0.9", default-features = false, features = ["pdf417", "encoders", "encoding_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
