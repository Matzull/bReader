[package]
name = "bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
default-run = "bench"

[lib]
name = "benchlib"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/main.rs"

[[bin]]
name = "zxing-samples-gt"
path = "src/bin/zxing_samples_gt.rs"

[features]
baselines = ["dep:rxing", "dep:rqrr"]
rayon = ["breader/rayon"]

[dependencies]
breader = { workspace = true, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rqrr = { version = "0.11", default-features = false, optional = true }
rxing = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
