name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    # `rust-version = "1.94"` (D-069): everything must compile on the oldest supported compiler. The
    # lockfile is used as committed, so a dependency that needs a newer compiler fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked
      # Outside the workspace (own lockfiles, same rust-version).
      - run: cargo check --manifest-path crates/breader-py/Cargo.toml --all-targets --locked
      - run: cargo check --manifest-path crates/breader-wasm/Cargo.toml --all-targets --locked

  miri:
    # The only `unsafe` code: the SIMD kernels of breader-imgproc and the C interface (D-064). The
    # C example test of breader-ffi compiles C and is not run under Miri (`tests/c_example.rs`).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test -p breader-imgproc --lib -- simd::tests
      - name: Miri (breader-ffi unit tests)
        # breader_scan_file opens files, which Miri forbids with isolation on.
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo miri test -p breader-ffi --lib

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm may be unavailable for private repos; see docs/CI.md.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # Only the crates with the rayon feature have feature-gated code.
      - run: cargo test -p breader -p breader-cli -p breader-imgproc -p breader-linear -p breader-qr -p breader-datamatrix --features breader/rayon
      # The C interface (D-064). `cargo test --workspace` above already compiled the C example
      # with -Werror and ran it on a QR code (crates/breader-ffi/tests/c_example.rs); here the
      # committed header must be what cbindgen generates, and the release library must link.
      - name: C interface (header up to date, release library)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cbindgen --locked --version 0.29.4
          cbindgen --config crates/breader-ffi/cbindgen.toml --crate breader-ffi --output crates/breader-ffi/include/breader.h
          git diff --exit-code -- crates/breader-ffi/include/breader.h
          cargo build --release -p breader-ffi
          cc -std=c99 -Wall -Wextra -Werror -pedantic -O2 -Icrates/breader-ffi/include crates/breader-ffi/examples/c/scan.c -Ltarget/release -lbreader -Wl,-rpath,$PWD/target/release -o scan-c
      # Release only (ignored in debug builds): the NFR-4 allocation counts are release numbers.
      - name: Allocation test (release)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p breader --test allocation

  regression:
    # Tier a on pull requests, tier b on pushes to main (docs/testing.md). The real datasets are only
    # fetched by datasets.yml, so CI runs the synthetic sets of the tier.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Synthetic regression gate
        run: tools/check-regression.sh --synthetic-only --tier ${{ github.event_name == 'pull_request' && 'a' || 'b' }}

  changes:
    # The wheels and pytest cost far more than the tests: build them on main, on tags, and when the
    # bindings or the facade crate changed.
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.diff.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -qE '^(crates/breader-py/|crates/breader/|\.github/workflows/ci\.yml)'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  python-wheels:
    name: wheel (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64 }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64 }
          - { name: macos-arm64, os: macos-latest, target: aarch64 }
          - { name: windows-x64, os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: auto
          working-directory: crates/breader-py
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: crates/breader-py/dist/*.whl
          if-no-files-found: error

  python-test:
    name: pytest (${{ matrix.os }})
    needs: python-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, wheel: linux-x86_64 }
          - { os: macos-latest, wheel: macos-arm64 }
          - { os: windows-latest, wheel: windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.wheel }}
          path: wheel
      - name: Install wheel and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel/*.whl numpy pillow segno pytest
      - name: Generate the synthetic dataset (Linux only)
        if: runner.os == 'Linux'
        run: |
          cargo run --release -p synth -- data/synth --seed 1
          echo "BREADER_SYNTH_DIR=$GITHUB_WORKSPACE/data/synth" >> "$GITHUB_ENV"
      - name: Run pytest against the installed wheel
        # Run from the tests directory so the source package is not imported instead of the wheel.
        working-directory: crates/breader-py/tests
        run: python -m pytest -q

  wasm:
    # The WebAssembly / JavaScript package (D-065): native unit tests, a release build for the web
    # and Node targets, and the Node test against the nodejs build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/breader-wasm
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: cargo fmt --manifest-path crates/breader-wasm/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/breader-wasm/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path crates/breader-wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --manifest-path crates/breader-wasm/Cargo.toml
      - run: node crates/breader-wasm/build.mjs
      - run: node crates/breader-wasm/tests/node.mjs
      - name: Package is private
        run: node -e 'const p=require("./crates/breader-wasm/pkg/package.json"); if(p.name!=="breader"||p.private!==true) process.exit(1)'
