name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm may be unavailable for private repos; see docs/CI.md.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # Only the crates with the rayon feature have feature-gated code.
      - run: cargo test -p breader -p breader-cli -p breader-imgproc -p breader-linear -p breader-qr -p breader-datamatrix --features breader/rayon
      # Release only (ignored in debug builds): the NFR-4 allocation counts are release numbers.
      - name: Allocation test (release)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p breader --test allocation

  regression:
    # Tier a on pull requests, tier b on pushes to main (docs/testing.md). The real datasets are only
    # fetched by datasets.yml, so CI runs the synthetic sets of the tier.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Synthetic regression gate
        run: tools/check-regression.sh --synthetic-only --tier ${{ github.event_name == 'pull_request' && 'a' || 'b' }}

  changes:
    # The wheels and pytest cost far more than the tests: build them on main, on tags, and when the
    # bindings or the facade crate changed.
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.diff.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -qE '^(crates/breader-py/|crates/breader/|\.github/workflows/ci\.yml)'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  python-wheels:
    name: wheel (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64 }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64 }
          - { name: macos-arm64, os: macos-latest, target: aarch64 }
          - { name: windows-x64, os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: auto
          working-directory: crates/breader-py
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: crates/breader-py/dist/*.whl
          if-no-files-found: error

  python-test:
    name: pytest (${{ matrix.os }})
    needs: python-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, wheel: linux-x86_64 }
          - { os: macos-latest, wheel: macos-arm64 }
          - { os: windows-latest, wheel: windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.wheel }}
          path: wheel
      - name: Install wheel and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel/*.whl numpy pillow segno pytest
      - name: Generate the synthetic dataset (Linux only)
        if: runner.os == 'Linux'
        run: |
          cargo run --release -p synth -- data/synth --seed 1
          echo "BREADER_SYNTH_DIR=$GITHUB_WORKSPACE/data/synth" >> "$GITHUB_ENV"
      - name: Run pytest against the installed wheel
        # Run from the tests directory so the source package is not imported instead of the wheel.
        working-directory: crates/breader-py/tests
        run: python -m pytest -q
