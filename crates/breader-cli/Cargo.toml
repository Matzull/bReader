[package]
name = "breader-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "Command line front end of the breader barcode reader"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "breader"
path = "src/main.rs"

[features]
# Multi-threaded kernels of the facade (see `breader/rayon`).
rayon = ["breader/rayon"]

[dependencies]
breader = { workspace = true, features = ["image"] }
# Decodes the bytes read from stdin; the same crate and features as the facade's `image` feature.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }

[lints]
workspace = true
