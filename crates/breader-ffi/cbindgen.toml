language = "C"
include_guard = "BREADER_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
sys_includes = ["stddef.h", "stdint.h", "stdbool.h"]
no_includes = true
style = "both"
usize_is_size_t = true
header = """/*
 * breader C interface (generated by cbindgen from crates/breader-ffi; do not edit).
 *
 * Ownership: every object created by the library (options, reader, results) is freed by
 * the matching *_free function; freeing NULL is a no-op. Every pointer returned by a
 * breader_result_* accessor lives until breader_results_free and is owned by the results.
 * Input buffers are only read during the call.
 *
 * Threads: an object (options, reader) must be used by one thread at a time. Different
 * readers may run on different threads; there is no global state. Results are read-only
 * and may be read from any thread until they are freed.
 *
 * Errors: functions that can fail return a BREADER_* status. A panic inside the library
 * is caught and reported as BREADER_PANIC; it never crosses this boundary.
 *
 * ABI: enumerations are uint32_t values with named constants; new constants may be added
 * in later versions, so treat unknown values as "other". Existing functions and constants
 * do not change meaning within a major version.
 */"""

[parse]
parse_deps = false
