[package]
name = "breader-qr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
rayon = ["dep:rayon"]

[dependencies]
breader-core.workspace = true
rayon = { version = "1", optional = true }
breader-ecc.workspace = true

[lints]
workspace = true

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
qrcode-generator = { version = "6.1", default-features = false, features = ["rmqr", "kanji"] }
breader-imgproc.workspace = true
