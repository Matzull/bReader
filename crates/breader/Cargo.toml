[package]
name = "breader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["qr", "linear"]
qr = ["dep:breader-qr"]
linear = ["dep:breader-linear"]
image = ["dep:image"]
# Multi-threaded kernels and scanning on rayon's global pool; results are
# identical to the single-threaded build. To bound the threads, run the scan
# inside `rayon::ThreadPoolBuilder::new().num_threads(n).build()?.install(..)`
# or set `RAYON_NUM_THREADS`.
rayon = ["breader-imgproc/rayon", "breader-linear?/rayon", "breader-qr?/rayon"]

[dependencies]
breader-core.workspace = true
breader-imgproc.workspace = true
breader-content.workspace = true
breader-qr = { workspace = true, optional = true }
breader-linear = { workspace = true, optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }

[lints]
workspace = true
