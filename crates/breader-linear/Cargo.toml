[package]
name = "breader-linear"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "1D barcode reader of breader: EAN/UPC, Code 128, Code 39, Code 93, ITF, Codabar, GS1 DataBar"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
rayon = ["dep:rayon"]

[dependencies]
breader-core.workspace = true
rayon = { version = "1", optional = true }

[dev-dependencies]
barcoders = { version = "2", default-features = false, features = ["std"] }
anyd = { version = "0.2", default-features = false, features = ["std", "alloc", "encode", "databar", "code93"] }

[lints]
workspace = true
